<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.title %}
    {% assign full_title = page.title | append: " · " | append: site.title %}
    {% else %}
    {% assign full_title = site.title %}
    {% endif %}
    {% assign page_description = page.description | default: site.description | strip_newlines %}
    <title>{{ full_title | escape }}</title>
    <meta name="description" content="{{ page_description | escape }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
    <link rel="manifest" href="{{ site.baseurl }}/site.webmanifest">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ full_title | escape }}">
    <meta property="og:description" content="{{ page_description | escape }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/android-chrome-512x512.png">
    <meta property="og:locale" content="es_MX">
    <meta name="twitter:card" content="summary">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://unpkg.com/freezeframe@3.0.10/build/css/freezeframe_styles.min.css">
    <link href="{{ site.baseurl }}/css/casafaro.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/freezeframe@3.0.10/build/js/freezeframe.pkgd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script>
        $(function() {
            $('.gif-freeze img[src$=".gif"],.gif-freeze[src$=".gif"]').freezeframe();
        });
    </script>
</head>
